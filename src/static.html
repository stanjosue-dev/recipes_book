<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipes book</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23c4603a'/><text y='24' x='5' font-size='20'>🍴</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <div class="card add-recipes">
      <div class="card-title">
        <i data-lucide="plus-circle" width="16" height="16"></i>
        Ajouter une recette
      </div>

      <div class="field">
        <label for="nom">Nom de la recette</label>
        <input type="text" id="nom" class="nom" spellcheck="false" placeholder="Ex : Poulet rôti">
      </div>

      <div class="field">
        <label for="ingredients">Ingrédients</label>
        <input type="text" id="ingredients" class="ingredients" spellcheck="false" placeholder="Ex : poulet, citron, ail…">
      </div>

      <div class="field">
        <label for="recipe">Étapes</label>
        <input type="text" id="recipe" class="recipe" spellcheck="false" placeholder="Ex : 1. Préchauffer le four…">
      </div>

      <div class="field">
        <label for="url">Image (lien web)</label>
        <input type="text" id="url" class="url" spellcheck="false" placeholder="https://…">
      </div>

      <button class="add-recipe">Ajouter la recette</button>
    </div>

    <div class="card boite-recipes">
      <div class="card-title">
        <i data-lucide="utensils" width="16" height="16"></i>
        Mes recettes
      </div>

      <div class="search">
        <input type="text" spellcheck="false" placeholder="Rechercher…">
        <button><img src="img/search.png" alt="Rechercher"></button>
      </div>

      <div class="list"></div>
    </div>

    <div class="card view-recipes">
      <div class="card-title">
        <i data-lucide="book-open" width="16" height="16"></i>
        Détail
      </div>
      <p>Sélectionnez une recette pour afficher son contenu.</p>
    </div>

  </div>

  <script>lucide.createIcons();</script>
  <script src="main.js"></script>
</body>
</html>
